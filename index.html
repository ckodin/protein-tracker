  <script type="text/babel">
// Full interactive prototype — onboarding → today → log → week → profile.

const THEME = {
  bg: '#FAF7F2', surface: '#FFFFFF', surface2: '#F4EFE7',
  ink: '#1A1817', muted: '#7A7470',
  accent: '#5B9A6B', accentSoft: 'rgba(91,154,107,0.12)',
  line: 'rgba(26,24,23,0.08)', dark: false,
  font: '-apple-system, "SF Pro Text", system-ui, sans-serif',
  fontDisplay: '-apple-system, "SF Pro Display", system-ui, sans-serif',
  numWeight: 300, numLetter: -2,
};

// ── Helpers ─────────────────────────────────────────────────
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function computeStreaks(series, goal) {
  const n = series.length;
  const todayHit = n > 0 && series[n-1].total >= goal;
  let priorStreak = 0;
  for (let i = n-2; i >= 0; i--) {
    if (series[i].total >= goal) priorStreak++;
    else break;
  }
  const current = todayHit ? priorStreak + 1 : priorStreak;
  let best = 0, run = 0;
  for (const d of series) {
    if (d.total >= goal) { run++; best = Math.max(best, run); }
    else run = 0;
  }
  const hits = series.filter(d => d.total >= goal).length;
  return { current, best, hits, total: n, todayHit, pending: !todayHit && priorStreak > 0, priorStreak };
}

function dayIntensity(total, goal) {
  if (total == null) return null;
  if (total < goal * 0.4) return 0.12;
  if (total < goal * 0.7) return 0.32;
  if (total < goal)       return 0.55;
  if (total < goal * 1.15) return 0.85;
  return 1.0;
}

// ── Persistence helpers ──────────────────────────────────────
const STORE_KEY = 'pt_v1';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveStore(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(ds, n) {
  const d = new Date(ds + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysAgo(ds) {
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - new Date(ds + 'T00:00:00')) / 86400000);
}
function friendlyDate(ds) {
  const ago = daysAgo(ds);
  if (ago === 0) return 'Today';
  if (ago === 1) return 'Yesterday';
  return new Date(ds + 'T00:00:00').toLocaleDateString('en-SG', { weekday: 'short', day: 'numeric', month: 'short' });
}

function ProtoApp({ isMobile = false }) {
  const theme = THEME;
  const tp = isMobile ? 14 : 60;

  // Load persisted state once on mount
  const saved = React.useMemo(() => loadStore(), []);
  const today = todayStr();

  // If it's a new day, roll yesterday's total into history and clear logs
  const [initialLogs, initialDailyTotals, initialPastLogs] = React.useMemo(() => {
    const savedDate = saved.logDate;
    const savedLogs = saved.logs || [];
    const savedPastLogs = saved.pastLogs || {};
    const savedGoal = saved.goal || 110;
    // Load or migrate: old saves have `history` array, new saves have `dailyTotals` object
    let baseTotals = saved.dailyTotals || null;
    if (!baseTotals) {
      baseTotals = {};
      const savedHistory = saved.history || [];
      for (let i = 0; i < savedHistory.length; i++) {
        if (savedHistory[i] > 0) {
          const d = new Date(); d.setDate(d.getDate() - (savedHistory.length - i));
          const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          baseTotals[ds] = { total: savedHistory[i], goal: savedGoal };
        }
      }
      for (const [date, logs] of Object.entries(savedPastLogs)) {
        const total = (logs || []).reduce((s, l) => s + l.protein, 0);
        if (total > 0) baseTotals[date] = { total, goal: savedGoal };
      }
    }
    if (savedDate && savedDate !== today) {
      const prevTotal = savedLogs.reduce((s, l) => s + l.protein, 0);
      const updatedPast = { ...savedPastLogs, [savedDate]: savedLogs };
      const keys = Object.keys(updatedPast).sort();
      const trimmedPast = Object.fromEntries(keys.slice(-30).map(k => [k, updatedPast[k]]));
      const updatedTotals = { ...baseTotals, [savedDate]: { total: prevTotal, goal: savedGoal } };
      return [[], updatedTotals, trimmedPast];
    }
    return [savedLogs, baseTotals, savedPastLogs];
  }, []);

  const [goal, setGoal] = React.useState(saved.goal || 110);
  const [screen, setScreen] = React.useState(saved.onboarded ? 'today' : 'onb-1');
  const [logOpen, setLogOpen] = React.useState(false);
  const [weight, setWeight] = React.useState(saved.weight || 70);
  const [activity, setActivity] = React.useState(saved.activity || 'beginner');
  const [logs, setLogs] = React.useState(initialLogs);
  const [dailyTotals, setDailyTotals] = React.useState(initialDailyTotals);
  const [pastLogs, setPastLogs] = React.useState(initialPastLogs);
  const [viewDate, setViewDate] = React.useState(todayStr());
  const [onboarded, setOnboarded] = React.useState(!!saved.onboarded);
  const [savedFoods, setSavedFoods] = React.useState(saved.savedFoods || []);

  const todayTotal = logs.reduce((s, l) => s + l.protein, 0);
  const pct = Math.min(1, todayTotal / goal);

  const series = React.useMemo(() => {
    const result = [];
    for (const ds of Object.keys(dailyTotals).sort()) {
      result.push({ date: new Date(ds + 'T00:00:00'), total: dailyTotals[ds].total });
    }
    result.push({ date: new Date(today + 'T00:00:00'), total: todayTotal });
    return result;
  }, [dailyTotals, todayTotal, today]);

  const streaks = React.useMemo(() => computeStreaks(series, goal), [series, goal]);

  const last7 = React.useMemo(() => Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const total = ds === today ? todayTotal : (dailyTotals[ds] ? dailyTotals[ds].total : 0);
    if (i === 6) return total >= goal ? 'hit' : 'pending';
    return total >= goal ? 'hit' : 'miss';
  }), [dailyTotals, todayTotal, goal, today]);

  const weekData = React.useMemo(() => Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return ds === today ? todayTotal : (dailyTotals[ds] ? dailyTotals[ds].total : 0);
  }), [dailyTotals, todayTotal, today]);

  // Persist whenever anything meaningful changes
  React.useEffect(() => {
    saveStore({ onboarded, weight, activity, goal, logDate: today, logs, dailyTotals, pastLogs, savedFoods });
  }, [onboarded, weight, activity, goal, logs, dailyTotals, pastLogs, savedFoods]);

  const goalFromWeight = (w, a) => {
    const ratio = a === 'beginner' ? 1.4 : a === 'moderate' ? 1.6 : 1.8;
    return Math.round((w * ratio) / 5) * 5;
  };

  const completeOnboarding = () => { setOnboarded(true); setScreen('today'); };

  const syncDailyTotalForDate = (date, entries) => {
    const total = (entries || []).reduce((s, l) => s + l.protein, 0);
    setDailyTotals(prev => ({ ...prev, [date]: { total, goal } }));
  };
  const addToPastDay = (date, entry) => {
    const newEntries = [...(pastLogs[date] || []), entry];
    setPastLogs(prev => ({ ...prev, [date]: newEntries }));
    syncDailyTotalForDate(date, newEntries);
  };

  const addFood = (food) => {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes();
    const time = `${h % 12 || 12}:${String(m).padStart(2,'0')}${h >= 12 ? 'p' : 'a'}`;
    const entry = { id: Date.now(), foodId: food.id, name: food.name, protein: food.protein, time };
    if (viewDate === todayStr()) {
      setLogs(prev => [...prev, entry]);
    } else {
      addToPastDay(viewDate, entry);
    }
    setLogOpen(false);
  };
  const removeLog = (id) => setLogs(prev => prev.filter(l => l.id !== id));
  const updateLog = (id, patch) => setLogs(prev => prev.map(l => l.id === id ? { ...l, ...patch } : l));

  const [editing, setEditing] = React.useState(null);
  const openCustomFood = (initialName = '') => { setLogOpen(false); setEditing({ isCustom: true, initialName }); };
  const saveEditing = ({ name, protein, time, saveToLibrary }) => {
    if (editing?.isCustom) {
      const entry = { id: Date.now(), foodId: 'custom', name, protein, time };
      if (viewDate === todayStr()) {
        setLogs(prev => [...prev, entry]);
      } else {
        addToPastDay(viewDate, entry);
      }
      if (saveToLibrary) saveFood({ name, protein });
    } else if (editing) {
      if (viewDate === todayStr()) {
        updateLog(editing.id, { name, protein, time });
      } else {
        const newEntries = (pastLogs[viewDate] || []).map(l => l.id === editing.id ? { ...l, name, protein, time } : l);
        setPastLogs(prev => ({ ...prev, [viewDate]: newEntries }));
        syncDailyTotalForDate(viewDate, newEntries);
      }
    }
    setEditing(null);
  };
  const deleteEditing = () => {
    if (editing && !editing.isCustom) {
      if (viewDate === todayStr()) {
        removeLog(editing.id);
      } else {
        const newEntries = (pastLogs[viewDate] || []).filter(l => l.id !== editing.id);
        setPastLogs(prev => ({ ...prev, [viewDate]: newEntries }));
        syncDailyTotalForDate(viewDate, newEntries);
      }
    }
    setEditing(null);
  };
  const saveFood = (food) => {
    const normalised = food.name.trim().toLowerCase();
    setSavedFoods(prev => {
      if (prev.some(f => f.name.trim().toLowerCase() === normalised)) return prev;
      return [...prev, { id: 'saved-' + Date.now(), name: food.name.trim(), protein: food.protein }];
    });
  };
  const removeSavedFood = (id) => setSavedFoods(prev => prev.filter(f => f.id !== id));

  let body;
  if (screen === 'onb-1')   body = <Onboarding1 T={theme} singlish="calm" onNext={() => setScreen('onb-2')} topPad={tp} />;
  else if (screen === 'onb-2') body = <Onboarding2 T={theme} weight={weight} setWeight={setWeight} activity={activity} setActivity={setActivity} onNext={() => { setGoal(goalFromWeight(weight, activity)); setScreen('onb-3'); }} onBack={() => setScreen('onb-1')} topPad={tp} />;
  else if (screen === 'onb-3') body = <Onboarding3 T={theme} weight={weight} activity={activity} suggestedGoal={goalFromWeight(weight, activity)} goal={goal} setGoal={setGoal} onDone={completeOnboarding} onBack={() => setScreen('onb-2')} singlish="calm" topPad={tp} />;
  else if (screen === 'today') body = <Today T={theme} logs={logs} todayTotal={todayTotal} goal={goal} pct={pct} onLog={() => setLogOpen(true)}
    onRemove={(id) => {
      if (viewDate === todayStr()) { removeLog(id); }
      else { const ne = (pastLogs[viewDate] || []).filter(l => l.id !== id); setPastLogs(p => ({...p, [viewDate]: ne})); syncDailyTotalForDate(viewDate, ne); }
    }}
    onEdit={(log) => setEditing(log)} singlish="calm" showWeekChart={true} streaks={streaks} last7={last7} weekData={weekData} topPad={tp} viewDate={viewDate} pastLogs={pastLogs} setViewDate={setViewDate} />;
  else if (screen === 'week')    body = <History T={theme} series={series} goal={goal} topPad={tp} />;
  else if (screen === 'profile') body = <Profile T={theme} goal={goal} setGoal={setGoal} weight={weight} activity={activity} onResetOnboarding={() => { setOnboarded(false); setScreen('onb-1'); }} topPad={tp} />;

  const showTabs = screen === 'today' || screen === 'week' || screen === 'profile';

  return (
    <div style={{
      width: '100%', height: '100%', position: 'relative',
      background: theme.bg, color: theme.ink,
      fontFamily: theme.font,
    }}>
      <div style={{ position: 'absolute', inset: 0, paddingBottom: showTabs ? 76 : 0, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>
          {body}
        </div>
      </div>

      {showTabs && <TabBar T={theme} screen={screen} setScreen={setScreen} onLog={() => setLogOpen(true)} />}

      <LogSheet open={logOpen} onClose={() => setLogOpen(false)} onAdd={addFood} onAddCustom={openCustomFood} T={theme} variant="tiles" todayTotal={todayTotal} goal={goal} savedFoods={savedFoods} onRemoveSaved={removeSavedFood} viewDate={viewDate} />

      <EditLogSheet editing={editing} T={theme} onClose={() => setEditing(null)} onSave={saveEditing} onDelete={deleteEditing} />

    </div>
  );
}

function Today({ T, logs, todayTotal, goal, pct, onLog, onRemove, onEdit, singlish, showWeekChart, streaks, last7, weekData, topPad = 60, viewDate, pastLogs, setViewDate }) {
  const today = todayStr();
  const isToday = !viewDate || viewDate === today;
  const displayLogs = isToday ? logs : (pastLogs && pastLogs[viewDate] || []);
  const displayTotal = displayLogs.reduce((s, l) => s + l.protein, 0);
  const displayPct = Math.min(1, displayTotal / goal);
  const remaining = Math.max(0, goal - displayTotal);
  const ringR = 86, ringC = 2 * Math.PI * ringR;

  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Morning' : hour < 17 ? 'Afternoon' : 'Evening';
  const name = 'Clarisse';

  const subtitle = (() => {
    if (!isToday) {
      if (displayTotal >= goal) return `Hit the ${goal}g goal that day.`;
      if (displayTotal === 0) return 'Nothing logged for this day. Add entries below.';
      return `${displayTotal}g logged · ${Math.round(displayTotal / goal * 100)}% of goal.`;
    }
    if (todayTotal >= goal) return singlish === 'cheeky' ? "Wah, hit goal liao 💪 Steady la." : "Goal hit. Solid day.";
    if (todayTotal === 0)   return singlish === 'cheeky' ? "Eh, nothing logged yet. Start with breakfast?" : "Nothing logged yet. A kaya toast set is a good start.";
    if (remaining <= 25)    return singlish === 'cheeky' ? `Only ${remaining}g more leh. One shake & confirm hit.` : `${remaining}g left. A protein shake closes it.`;
    return singlish === 'cheeky' ? `${remaining}g to go. One chicken rice is ~28g.` : `${remaining}g remaining. A chicken rice is ~28g.`;
  })();

  const navChevron = (label, onClick) => (
    <button onClick={onClick} style={{
      all: 'unset', cursor: 'pointer', width: 30, height: 30, borderRadius: 15,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: T.muted, fontSize: 20, lineHeight: 1,
    }}>{label}</button>
  );

  return (
    <div style={{ padding: `${topPad}px 0 12px` }}>
      <div style={{ padding: '8px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
            {navChevron('‹', () => setViewDate && setViewDate(addDays(viewDate || today, -1)))}
            <div style={{ fontSize: 12, color: T.muted, letterSpacing: 0.2, textTransform: 'capitalize' }}>
              {isToday
                ? new Date().toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'short' })
                : new Date((viewDate || today) + 'T00:00:00').toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'short' })
              }
            </div>
            {!isToday && navChevron('›', () => setViewDate && setViewDate(addDays(viewDate, 1)))}
          </div>
          {isToday ? (
            <div style={{ fontSize: 22, fontWeight: 600, letterSpacing: -0.3, marginTop: 2, fontFamily: T.fontDisplay }}>
              {greet}, {name}.
            </div>
          ) : (
            <button onClick={() => setViewDate && setViewDate(today)} style={{
              all: 'unset', cursor: 'pointer', fontSize: 13, color: T.accent, marginTop: 3, fontWeight: 600,
            }}>Back to today →</button>
          )}
        </div>
        {isToday && (
          <div style={{
            width: 38, height: 38, borderRadius: 19,
            background: T.surface, border: `1px solid ${T.line}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 13, color: T.muted, fontWeight: 600,
          }}>{name[0]}</div>
        )}
      </div>

      <div style={{ display: 'flex', justifyContent: 'center', marginTop: 22 }}>
        <div style={{ position: 'relative', width: 220, height: 220 }}>
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r={ringR} fill="none" stroke={T.line} strokeWidth="6"/>
            <circle cx="110" cy="110" r={ringR} fill="none"
              stroke={T.accent} strokeWidth="6" strokeLinecap="round"
              strokeDasharray={`${ringC} ${ringC}`}
              strokeDashoffset={ringC * (1 - displayPct)}
              transform="rotate(-90 110 110)"
              style={{ transition: 'stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)', filter: T.dark ? `drop-shadow(0 0 8px ${T.accent}66)` : 'none' }}/>
          </svg>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ fontSize: 64, fontWeight: T.numWeight, letterSpacing: T.numLetter, fontVariantNumeric: 'tabular-nums', lineHeight: 1, fontFamily: T.fontDisplay }}>
              {displayTotal}<span style={{ fontSize: 24, color: T.muted, fontWeight: 400, marginLeft: 2 }}>g</span>
            </div>
            <div style={{ fontSize: 12, color: T.muted, marginTop: 8, letterSpacing: 0.4, fontVariantNumeric: 'tabular-nums' }}>
              of {goal}g · {Math.round(displayPct*100)}%

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 8px 8px' }}>

function StatCell({ T, icon, value, label, accent, small, center }) {

function CalendarBlock({ T, series, goal }) {
  const [offset, setOffset] = React.useState(0);
  const today = new Date();
  const view = new Date(today.getFullYear(), today.getMonth() + offset, 1);
  const monthLabel = view.toLocaleDateString('en', { month: 'long', year: 'numeric' });

  const lookup = {};
  for (const d of series) lookup[d.date.toDateString()] = d.total;

  const firstDow = (view.getDay() + 6) % 7;
  const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(view.getFullYear(), view.getMonth(), d));
  while (cells.length % 7) cells.push(null);

  let monthHits = 0, monthLogged = 0, monthSum = 0;
  cells.forEach(d => {
    if (!d || d > today) return;
    const t = lookup[d.toDateString()];
    if (t != null) { monthLogged++; monthSum += t; if (t >= goal) monthHits++; }
  });
  const monthAvg = monthLogged ? Math.round(monthSum / monthLogged) : 0;

  return (
    <div style={{ padding: '14px 16px 0' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 4px 10px' }}>
        <div style={{ fontSize: 11, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>By month</div>
        <div style={{ fontSize: 11, color: T.muted, fontVariantNumeric: 'tabular-nums' }}>
          <b style={{ color: T.ink }}>{monthHits}</b>/{monthLogged} hit · avg {monthAvg}g
        </div>
      </div>
      <div style={{ background: T.surface, border: `1px solid ${T.line}`, borderRadius: 16, padding: '14px 14px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 4px 12px' }}>
          <button onClick={() => setOffset(o => o - 1)} disabled={offset <= -3} style={{
            all: 'unset', cursor: offset <= -3 ? 'not-allowed' : 'pointer',
            width: 28, height: 28, borderRadius: 14,
            background: T.bg, border: `1px solid ${T.line}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: offset <= -3 ? T.line : T.ink, opacity: offset <= -3 ? 0.4 : 1,
          }}>
            <svg width="8" height="12" viewBox="0 0 8 12"><path d="M6 2L2 6l4 4" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round"/></svg>
          </button>
          <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, fontFamily: T.fontDisplay, letterSpacing: -0.2 }}>{monthLabel}</div>
          <button onClick={() => setOffset(o => Math.min(0, o + 1))} disabled={offset >= 0} style={{
            all: 'unset', cursor: offset >= 0 ? 'not-allowed' : 'pointer',
            width: 28, height: 28, borderRadius: 14,
            background: T.bg, border: `1px solid ${T.line}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: offset >= 0 ? T.line : T.ink, opacity: offset >= 0 ? 0.4 : 1,
          }}>
            <svg width="8" height="12" viewBox="0 0 8 12"><path d="M2 2l4 4-4 4" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round"/></svg>
          </button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, padding: '0 2px 6px' }}>
          {['M','T','W','T','F','S','S'].map((d, i) => (
            <div key={i} style={{ textAlign: 'center', fontSize: 10, color: T.muted, fontWeight: 600 }}>{d}</div>
          ))}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, padding: '0 2px' }}>
          {cells.map((d, i) => {
            if (!d) return <div key={i} style={{ aspectRatio: '1' }} />;
            const total = lookup[d.toDateString()];
            const inten = dayIntensity(total, goal);
            const isFuture = d > today;
            const isToday = d.toDateString() === today.toDateString();
            const isHit = total != null && total >= goal;
            const cellColor = inten == null ? null : hexAlpha(isHit ? T.accent : '#D4823A', Math.max(0.1, inten));
            const textColor = inten > 0.6 ? T.ink : T.muted;
            return (
              <div key={i} role="gridcell"
                aria-label={isFuture ? undefined : `${d.toLocaleDateString('en', { month: 'short', day: 'numeric' })}, ${total != null ? total + 'g of ' + goal + 'g goal ' + (isHit ? 'met' : 'missed') : 'no data'}`}
                style={{
                  aspectRatio: '1', borderRadius: 8,
                  background: isFuture ? 'transparent' : cellColor ?? T.bg,
                  border: isToday ? `1.5px solid ${T.ink}` : inten == null && !isFuture ? `1px dashed ${T.line}` : `1px solid ${T.line}`,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                  opacity: isFuture ? 0.25 : 1, color: textColor,
                }}>
                <div style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, fontVariantNumeric: 'tabular-nums' }}>{d.getDate()}</div>
                {total != null && !isFuture && (
                  <div style={{ fontSize: 8, opacity: 0.7, fontVariantNumeric: 'tabular-nums', marginTop: -1, color: textColor }}>{total}</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function InsightsBlock({ T, series, goal }) {
  if (series.length < 7) {
    return (
      <div style={{ padding: '20px 16px 0' }}>
        <div style={{ background: T.surface, border: `1px dashed ${T.line}`, borderRadius: 14, padding: '20px 16px', textAlign: 'center', fontSize: 13, color: T.muted, lineHeight: 1.5 }}>
          Log for 7 days to unlock patterns.
        </div>
      </div>
    );
  }
  const byDow = [0,0,0,0,0,0,0], cntDow = [0,0,0,0,0,0,0];
  for (const d of series) {
    const dow = d.date.getDay();
    cntDow[dow]++;
    if (d.total >= goal) byDow[dow]++;
  }
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const rates = byDow.map((h, i) => ({ rate: cntDow[i] ? h / cntDow[i] : 0, label: dayNames[i] }));
  const best = [...rates].sort((a,b) => b.rate - a.rate)[0];
  const worst = [...rates].sort((a,b) => a.rate - b.rate)[0];
  const last30 = series.slice(-30);
  const avg30 = Math.round(last30.reduce((s, d) => s + d.total, 0) / last30.length);
  return (
    <>
      <div style={{ padding: '20px 20px 8px', fontSize: 11, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>Patterns</div>
      <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <InsightCard T={T} eyebrow="Strongest day"
          headline={`${best.label}s · ${Math.round(best.rate * 100)}% hit rate`}
          body={`You're most consistent on ${best.label}s. Anchor habits there.`} />
        <InsightCard T={T} eyebrow="Weak spot"
          headline={`${worst.label}s · only ${Math.round(worst.rate * 100)}% hit`}
          body={`${worst.label}s tend to slip. Plan one easy 30g meal in advance.`} />
        <InsightCard T={T} eyebrow="30-day average"
          headline={`${avg30}g per day`}
          body={avg30 >= goal
            ? `That's above your ${goal}g goal — trend is up.`
            : `${goal - avg30}g short of goal on average. Closeable with one shake.`} />
      </div>
    </>
  );
}

function InsightCard({ T, eyebrow, headline, body }) {
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}`, borderRadius: 14, padding: '14px 16px' }}>
      <div style={{ fontSize: 11, color: T.accent, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase' }}>{eyebrow}</div>
      <div style={{ fontSize: 15, color: T.ink, marginTop: 4, fontWeight: 600, letterSpacing: -0.2 }}>{headline}</div>

    </div>
  );
}

function WeekBars({ T, data, goal, tall }) {
  // Reorder rolling window into fixed Mon–Sun slots
  const todaySlot = (new Date().getDay() + 6) % 7; // 0=Mon … 6=Sun
  const ordered = [0,1,2,3,4,5,6].map(slot => {
    const daysAgo = ((todaySlot - slot) + 7) % 7;
    return data[data.length - 1 - daysAgo];
  });
  const days = ['M','T','W','T','F','S','S'];
  const max = Math.max(goal * 1.1, ...ordered);
  const H = tall ? 160 : 90;
  return (
    <div style={{ position: 'relative', height: H + 22, display: 'flex', alignItems: 'flex-end', gap: 8 }}>
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: `${(goal/max)*H + 22}px`, height: 1, borderTop: `1px dashed ${T.line}` }}>
        <span style={{ position: 'absolute', right: 0, top: -15, fontSize: 9, color: T.muted, letterSpacing: 1, textTransform: 'uppercase', fontWeight: 600, background: T.surface, padding: '0 4px' }}>
          goal {goal}g
        </span>
      </div>
      {ordered.map((v, slot) => {
        const h = (v / max) * H;
        const hit = v >= goal;
        const isToday = slot === todaySlot;
        const missed = v > 0 && !hit;
        const bg = hit ? T.accent : missed ? '#D4823A' : (T.dark ? '#3a3a3a' : T.surface2);
        const border = isToday ? `1.5px solid ${T.ink}` : missed ? `1.5px solid ${T.muted}` : 'none';
        return (
          <div key={slot} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, justifyContent: 'flex-end', height: '100%' }}>
            <div style={{ fontSize: 9, color: hit ? T.accent : T.muted, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{v > 0 ? v : ''}</div>
            <div style={{
              width: '100%', height: `${h}px`,
              background: bg,
              borderRadius: 4, minHeight: 4,
              border,
              transition: 'height .4s',
            }}/>
            <div style={{ fontSize: 11, color: isToday ? T.ink : T.muted, fontWeight: isToday ? 700 : 500 }}>{days[slot]}</div>
          </div>
        );
      })}
    </div>
  );
}

window.TIER_COLORS = { low: '#C9B07D', med: '#D89233', high: '#2D6B47' };
window.tierColor = function (g) {
  if (g >= 25) return window.TIER_COLORS.high;
  if (g >= 12) return window.TIER_COLORS.med;
  return window.TIER_COLORS.low;
};

// With interactive-widget=resizes-content in the viewport meta, the layout
// viewport shrinks when the keyboard appears. position:fixed;bottom:0 therefore
// naturally sits just above the keyboard — no JS measurement needed.
// This hook is kept as a no-op so call sites don't need changing.
function useKeyboardHeight() { return { kh: 0, vvh: window.innerHeight }; }

function LogSheet({ open, onClose, onAdd, onAddCustom, T, variant, todayTotal, goal, savedFoods, onRemoveSaved, viewDate }) {
  const [mounted, setMounted] = React.useState(open);
  const [shown, setShown] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const { kh, vvh } = useKeyboardHeight();
  const isMob = window.innerWidth <= 500;
  React.useEffect(() => {
    if (open) {
      setMounted(true);
      setQuery('');
      requestAnimationFrame(() => requestAnimationFrame(() => setShown(true)));
    } else {
      setShown(false);
      const t = setTimeout(() => setMounted(false), 280);
      return () => clearTimeout(t);
    }

function highlight(text, q, T) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());

  return (
    <>
      {text.slice(0, i)}
      <span style={{ background: T.accentSoft, color: T.accent, padding: '0 2px', borderRadius: 3 }}>{text.slice(i, i+q.length)}</span>
      {text.slice(i+q.length)}
    </>
  );
}

function Field({ T, label, children }) {
  return (
    <div>

function timeTo24(s) {
  if (!s) return '12:00';
  const m = s.match(/^(\d+):(\d+)([ap])$/);
  if (!m) return s;
  let [, h, mm, ap] = m;
  h = parseInt(h, 10);
  if (ap === 'p' && h !== 12) h += 12;
  if (ap === 'a' && h === 12) h = 0;
  return `${String(h).padStart(2,'0')}:${mm}`;
}
function time24ToDisplay(s) {
  const [h, m] = s.split(':').map(Number);
  const ap = h >= 12 ? 'p' : 'a';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')}${ap}`;
}
function format24Now() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/protein-tracker/sw.js')
          .then(reg => reg.update()) // always check for a new version on load
          .catch(() => {});
      });
    }
  </script>
